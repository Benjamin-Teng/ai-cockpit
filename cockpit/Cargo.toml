[package]
name = "cockpit"
version = "0.1.2"
edition.workspace = true
publish = false
# 第二個 bin（cockpit-launch）加入後，沒有 --bin 的 `cargo run -p cockpit` 仍選 cockpit
# （desktop-launch-notify task 2.3；design D1）。
default-run = "cockpit"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
cockpit-core = { version = "0.1.0", path = "../cockpit-core" }
# file-review task 3.1（design D1；ADR 0006）：檔案瀏覽的純邏輯 crate，依賴方向 cockpit → cockpit-files。
cockpit-files = { path = "../cockpit-files" }
cockpit-herdr = { version = "0.1.0", path = "../cockpit-herdr" }
# git-review task 3.2（design D1；ADR 0007）：git 讀取的封閉查詢層，依賴方向 cockpit → cockpit-git。
cockpit-git = { path = "../cockpit-git" }
# file-review task 3.3（design D9）：把 `cockpit/assets/vendor/` 整棵樹內嵌進執行檔，
# `/vendor/{*path}` 從嵌入目錄查找。只加在 `cockpit`，不影響 `cockpit-files` 等其他 crate。
include_dir = "0.7.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# auto-update task 1.2（design D3、D6）：下載 `SHA256SUMS.txt` 與安裝檔後計算 SHA-256 比對；純 Rust 實作、無系統相依。
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# auto-update task 1.2（design D3、D6）：啟動器用的同步 HTTP client（查 GitHub `releases/latest`、下載資產）。
# 預設 feature（`rustls` + `gzip`）的 TLS 後端就是 rustls（ring 加密、內建 webpki-roots 根憑證），
# 不帶入 native-tls／openssl，所以用預設值、不另指定 feature。預設 `Agent` 會讀 `ALL_PROXY`／`HTTPS_PROXY`／
# `HTTP_PROXY` 環境變數；不讀 Windows 系統代理（那要 `win-system-proxy` feature，本 change 不啟用）。
ureq = "3.4.2"

[dev-dependencies]
# live-output fix round 1（R11）：`cockpit/tests/output_endpoint.rs` 的 `FakeOutputRuntime`
# 要實作 `cockpit_core::AgentRuntime`（trait 定義用 `#[async_trait::async_trait]`），版本與
# `cockpit-core`／`cockpit-herdr`／`herdr-client` 完全相同（已在 `Cargo.lock`，不會下載新
# 套件）。只加在 `[dev-dependencies]`，不影響正式相依集合。
async-trait = "0.1.92"
futures-util = { version = "0.3.34", features = ["sink"] }
http-body-util = "0.1.5"
tokio-tungstenite = "0.30.0"
# Task 6.4：`#[tokio::test(start_paused = true)]` 在 tokio 的 `test-util` feature 之後（同
# `cockpit-core/Cargo.toml` 的做法）。只加在 `[dev-dependencies]`，不影響正式建置。
tokio = { version = "1.53.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
# app-icon task 3.1（design D3）：build.rs 把應用程式圖示與版本資訊編成 Windows 資源，連結進兩個執行檔。
# 只在建置期使用、不進執行檔的程式碼；Windows 目標需要 Windows SDK 的 rc.exe。使用者 2026-10-04 同意加入。
winresource = "0.1.31"
