[package]
name = "cockpit"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
cockpit-core = { version = "0.1.0", path = "../cockpit-core" }
# file-review task 3.1（design D1；ADR 0006）：檔案瀏覽的純邏輯 crate，依賴方向 cockpit → cockpit-files。
cockpit-files = { path = "../cockpit-files" }
cockpit-herdr = { version = "0.1.0", path = "../cockpit-herdr" }
# file-review task 3.3（design D9）：把 `cockpit/assets/vendor/` 整棵樹內嵌進執行檔，
# `/vendor/{*path}` 從嵌入目錄查找。只加在 `cockpit`，不影響 `cockpit-files` 等其他 crate。
include_dir = "0.7.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# live-output fix round 1（R11）：`cockpit/tests/output_endpoint.rs` 的 `FakeOutputRuntime`
# 要實作 `cockpit_core::AgentRuntime`（trait 定義用 `#[async_trait::async_trait]`），版本與
# `cockpit-core`／`cockpit-herdr`／`herdr-client` 完全相同（已在 `Cargo.lock`，不會下載新
# 套件）。只加在 `[dev-dependencies]`，不影響正式相依集合。
async-trait = "0.1.92"
futures-util = { version = "0.3.34", features = ["sink"] }
http-body-util = "0.1.5"
tokio-tungstenite = "0.30.0"
# Task 6.4：`#[tokio::test(start_paused = true)]` 在 tokio 的 `test-util` feature 之後（同
# `cockpit-core/Cargo.toml` 的做法）。只加在 `[dev-dependencies]`，不影響正式建置。
tokio = { version = "1.53.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
