# cockpit 設定檔範例（設計文件 §8.2）。
#
# 用法：複製成 cockpit.toml 放在啟動 cockpit 的工作目錄，或用 `--config <path>` 指定。
# cockpit.toml 在 .gitignore 裡，不會進 repo——裡面會有真實的使用者名稱與路徑。
# 下面所有路徑的 <user> 都要換成自己的使用者名稱。
#
# 全部省略（連檔案都不放）＝零設定模式：等同一筆 id = "local"、自動找本機 HERDR 的 runtime。

[server]
# 位址只能是 127.0.0.1 或 ::1，埠不得為 80（來源檢查只認 127.0.0.1／localhost／[::1] 加明確埠）。
# 被占用時啟動失敗並印出位址與原因，不會自動換 port。
listen = "127.0.0.1:7770"

[polling]
# Connected 期間距上次成功取得 snapshot 多久之後再重拿一次；不得為 0。
resnapshot_secs = 30
# WSL 發行版探測失敗後的固定重試間隔；不得為 0。
wsl_probe_secs = 60

# 每筆 runtime 的 socket、wsl、command 三選一；同時給兩個以上啟動時報錯並指出是哪一筆。
# 三個都省略則自動找本機預設路徑（HERDR_SOCKET_PATH → HERDR_SESSION → 預設路徑）。
# id 重複同樣啟動時報錯。Windows 路徑在 TOML 用單引號 literal string。

[[runtime]]
id = "win"
kind = "herdr"
# socket = 'C:\Users\<user>\AppData\Roaming\herdr\herdr.sock'   # 省略則照 HERDR 規則找預設

[[runtime]]
id = "wsl"
kind = "herdr"
wsl = { distro = "Ubuntu-24.04", socket = "/home/<user>/.config/herdr/herdr.sock" }

# 通用逃生口：任何能把 stdio 接到 HERDR socket 的指令
# [[runtime]]
# id = "other"
# kind = "herdr"
# command = ["some-bridge", "--arg"]

# 選填；狀態檔位置。相對路徑相對於這份設定檔所在目錄解析，未給時預設為設定檔目錄下的
# cockpit.state.json。沒有任何 [[project]] 時不讀不寫狀態檔。
# [state]
# path = "cockpit.state.json"

# 零到多筆 [[project]]：一條 Pipeline（stages）加若干 workstream 與 task。
# 這些區段與欄位之外的未知欄位會啟動失敗。

[[project]]
id = "cockpit"
name = "AI Cockpit"
# stages 的陣列順序即 Stage 的線性順序，字串同時是 Stage 的識別與顯示名稱。
stages = ["Spec", "Build", "Review", "Done"]

# 沒有 binding 的 workstream：只用來分組畫面上的欄，不會顯示綁定摘要。
[[project.workstream]]
id = "planning"

# 有 binding 的 workstream：runtime 必須是上面某一筆 [[runtime]] 的 id；workspace 必填，
# pane_label、cwd、agent 選填，三者是縮小候選 pane 的篩選條件。
[[project.workstream]]
id = "backend"
binding = { runtime = "wsl", workspace = "ai-cockpit", pane_label = "backend", agent = "claude" }

[[project.task]]
id = "spec"
title = "寫 spec"
workstream = "planning"
stage = "Spec"

[[project.task]]
id = "impl"
title = "實作"
workstream = "backend"
stage = "Build"
depends_on = ["spec"]
